<style>
:root{
  --blue:#032EA1; --blue-dk:#02206f; --blue-lt:#e6ecfa; --ink:#14213d; --muted:#56627a;
  --bg:#eef2f8; --paper:#fff; --line:#cfd8e6; --red:#c8102e; --red-lt:#fde8eb;
  --green:#1a7f4b; --green-lt:#e2f3e9; --amber:#9a5b00; --amber-lt:#fff3d6; --grey-lt:#eef0f4;
  --body:'Kantumruy Pro','Noto Sans Khmer','Khmer OS Siemreap','Segoe UI',system-ui,sans-serif;
  --title:'Moul','Khmer OS Muol Light','Kantumruy Pro',serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.7;padding-bottom:96px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #ffb81c;outline-offset:2px}
[hidden]{display:none!important}

/* masthead */
.mast{background:var(--blue);color:#fff;border-bottom:6px solid var(--red)}
.mast-in{max-width:980px;margin:0 auto;padding:14px 16px;display:flex;gap:12px;align-items:center}
.emblem{flex:none;width:60px;height:60px;border-radius:50%;background:#fff;padding:3px}
.emblem img{width:100%;height:100%;object-fit:contain;border-radius:50%;display:block}
.mast-txt{flex:1;min-width:0}
.mast h1{font-family:var(--title);font-weight:400;font-size:clamp(16px,4.2vw,23px);line-height:1.8;margin:0}
.mast .sub{font-size:15px;opacity:.92;margin:0;line-height:1.5}
.lang{flex:none;background:transparent;border:2px solid #fff;color:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:16px;min-height:44px}
.lang:hover{background:#fff;color:var(--blue)}

/* tabs */
.tabs{position:sticky;top:0;z-index:20;background:var(--blue-dk);display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:transparent;border:0;color:#c9d4f5;padding:8px 4px 9px;font-weight:600;font-size:15px;cursor:pointer;line-height:1.35;border-bottom:4px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:#ffb81c;background:rgba(255,255,255,.06)}
@media(min-width:700px){.tab{flex-direction:row;justify-content:center;gap:8px;font-size:17px;padding:12px 6px}}

.wrap{max-width:980px;margin:0 auto;padding:0 12px 30px}
.panel{padding-top:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 14px;margin-bottom:14px}
h2{font-size:21px;margin:0 0 4px;font-weight:700;line-height:1.5}
h3{font-size:19px;margin:0 0 6px;font-weight:700;line-height:1.5}
.hint{color:var(--muted);font-size:16px;margin:0 0 12px;line-height:1.6}
.req{color:var(--red)}

.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:640px){.grid.g2{grid-template-columns:1fr 1fr}}
.f label,.f .lab{display:block;font-weight:600;font-size:17px;margin-bottom:5px;line-height:1.5}
.f input,.f select,.f textarea,.ctl{width:100%;border:2px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;min-height:54px;font-size:19px}
.f textarea{min-height:84px;resize:vertical;font-size:18px}
.f input:focus,.f select:focus,.f textarea:focus,.ctl:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(3,46,161,.15)}
.row2{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.warnline{background:var(--amber-lt);border:1.5px solid #e2b93b;border-radius:8px;padding:10px 12px;font-size:16px;font-weight:600;margin-top:10px}
.editbar{background:var(--amber-lt);border:2px solid #e2b93b;border-radius:10px;padding:10px 12px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:700}
.calc{margin-top:8px;font-weight:600;color:var(--blue);font-size:16px}

/* group + measure sections */
h2.grp{font-family:var(--title);font-weight:400;font-size:18px;color:var(--blue);margin:22px 2px 10px;line-height:1.9}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 12px;min-height:62px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:"";flex:none;width:12px;height:12px;border-right:3px solid var(--blue);border-bottom:3px solid var(--blue);transform:rotate(45deg);margin:0 4px 6px 2px;transition:transform .15s}
.sec[open]>summary::after{transform:rotate(-135deg);margin-bottom:-4px}
.sec[open]>summary{border-bottom:1px solid var(--line);background:#f6f8fd}
.mc{flex:none;background:var(--blue);color:#fff;font-weight:700;border-radius:6px;padding:2px 9px;font-size:16px}
.mt{flex:1;font-weight:700;font-size:18px;line-height:1.5}
.badge{flex:none;font-size:15px;font-weight:700;border-radius:20px;padding:2px 10px;background:var(--grey-lt);color:var(--muted)}
.badge.done{background:var(--green-lt);color:var(--green)}
.badge.part{background:var(--amber-lt);color:var(--amber)}
.sec-b{padding:4px 12px 12px}

/* indicator card */
.ind{border-bottom:1px dashed var(--line);padding:14px 0}
.ind:last-child{border-bottom:0}
.ind-top{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:15px}
.code{font-weight:700;color:var(--blue);background:var(--blue-lt);border-radius:5px;padding:1px 8px}
.chip{border:1px solid var(--line);border-radius:5px;padding:0 8px;color:var(--muted);background:#fff}
.ind h4{margin:6px 0 4px;font-size:19px;line-height:1.55}
details.def>summary,details.note>summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:16px;padding:4px 0;list-style:none}
details.def>summary::-webkit-details-marker,details.note>summary::-webkit-details-marker{display:none}
details.def>summary::before{content:"ⓘ ";}
details.note>summary::before{content:"✎ ";}
.defbox{background:#f6f8fd;border-left:4px solid var(--blue);padding:8px 12px;font-size:16px;margin:4px 0 8px;line-height:1.65}
.defbox p{margin:0 0 6px}
.defbox div{margin:2px 0}
.defbox b{font-weight:700}
.nd{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.nd.one{grid-template-columns:1fr}
.nd .f label{font-size:16px;font-weight:600;color:var(--ink)}
.nd .f label .tag{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:var(--muted);border-radius:4px;padding:0 6px;margin-right:4px;vertical-align:1px}
.nd .f input{font-size:22px;font-weight:700;text-align:center}
.auto{border:2px dashed var(--line);border-radius:8px;padding:8px 10px;background:#f6f8fd}
.auto .lab{font-size:16px;font-weight:600}
.auto output{display:block;font-size:22px;font-weight:700;text-align:center;color:var(--blue)}
.auto small{display:block;text-align:center;color:var(--muted);font-size:13.5px}
.res{margin-top:10px;border-radius:8px;padding:8px 12px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.res .v{font-size:22px}
.res.nodata{background:var(--grey-lt);color:var(--muted);font-weight:600;font-size:16px}
.res.met{background:var(--green-lt);color:var(--green)}
.res.notmet{background:var(--red-lt);color:var(--red)}
.res.mon{background:var(--blue-lt);color:var(--blue)}
.res.bad{background:var(--amber-lt);color:var(--amber)}
.res.na{background:var(--grey-lt);color:var(--muted)}
.na-l{display:flex;align-items:center;gap:10px;margin:10px 0 2px;font-size:16px;cursor:pointer;min-height:44px}
.na-l input{width:26px;height:26px;flex:none;accent-color:var(--blue)}
.ind.is-na .nd{opacity:.45}
.act{border:2px solid var(--red);border-radius:10px;padding:10px 12px;margin-top:10px;background:#fffafa}
.act-h{font-weight:700;color:var(--red);margin-bottom:6px;font-size:17px}
.act .f{margin-bottom:10px}
.act .f label{font-size:16px}
.two-in{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.two-in{grid-template-columns:1.3fr 1fr}}
.note textarea{width:100%;border:2px solid var(--line);border-radius:8px;padding:8px 10px;min-height:70px;font-size:17px}

/* buttons */
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btn{border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;min-height:52px;font-size:17px}
.btn:hover{background:#eaf0fd}
.btn.pri{background:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-dk)}
.btn.sm{padding:4px 12px;min-height:40px;font-size:15px}
.btn.del{border-color:var(--red);color:var(--red)}
.btn.ok{border-color:var(--green);color:var(--green)}

/* sticky save bar */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:3px solid var(--blue);box-shadow:0 -4px 14px rgba(0,0,0,.08);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.savebar-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px}
.prog{flex:1;min-width:0}
.prog .txt{font-size:15.5px;font-weight:600;line-height:1.4}
.bar{height:10px;background:var(--grey-lt);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .2s}
.savebar .btn{min-width:130px}

/* dashboard */
.filters{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.filters label{font-size:15px;font-weight:600;display:block;margin-bottom:3px}
.filters .ctl{min-height:50px;font-size:17px}
.chk{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;grid-column:1/-1;min-height:40px}
.chk input{width:22px;height:22px;accent-color:var(--blue)}
@media(min-width:760px){.filters{grid-template-columns:1fr 1fr 1fr 1fr}.chk{grid-column:auto;align-self:end}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
@media(min-width:760px){.tiles{grid-template-columns:repeat(5,1fr)}}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .n{font-size:30px;font-weight:700;color:var(--blue);line-height:1.2}
.tile .l{font-size:15px;color:var(--muted);line-height:1.45}
.tile.red .n{color:var(--red)} .tile.green .n{color:var(--green)}
.band{border-radius:10px;padding:12px 14px;margin-bottom:12px;border:2px solid}
.band.full{border-color:var(--green);background:var(--green-lt)}
.band.part{border-color:#e2b93b;background:var(--amber-lt)}
.band.not{border-color:var(--red);background:var(--red-lt)}
.band b{font-size:19px}
.band p{margin:4px 0 0;font-size:15.5px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.mcell{border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.45;border:1px solid var(--line);background:#fff;cursor:pointer;text-align:left}
.mcell b{display:block;font-size:16px}
.mcell.met{background:var(--green-lt);border-color:#9fd3b5}
.mcell.notmet{background:var(--red-lt);border-color:#f0a9b5}
.mcell.mon{background:var(--blue-lt);border-color:#b3c3ef}
.mcell.nodata{background:var(--grey-lt);color:var(--muted)}
.chartbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px}
.chartbox .cv{position:relative;height:290px}
.ilist{list-style:none;margin:0;padding:0}
.ilist li{border-bottom:1px solid var(--line);padding:10px 4px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;cursor:pointer}
.ilist li:hover{background:#f6f8fd}
.ilist .nm{font-size:16.5px;line-height:1.5}
.ilist .nm .code{font-size:14px;margin-right:6px}
.ilist .val{text-align:right;font-weight:700;font-size:18px;white-space:nowrap}
.ilist .sub{font-size:14px;color:var(--muted)}
.ilist h4{margin:14px 0 2px;font-size:16.5px;color:var(--blue)}
.pill{display:inline-block;border-radius:20px;padding:0 10px;font-size:14px;font-weight:700;white-space:nowrap}
.pill.met{background:var(--green-lt);color:var(--green)}
.pill.notmet{background:var(--red-lt);color:var(--red)}
.pill.mon{background:var(--blue-lt);color:var(--blue)}
.pill.nodata,.pill.na{background:var(--grey-lt);color:var(--muted)}
.pill.verified{background:var(--green-lt);color:var(--green)}
.pill.submitted{background:var(--amber-lt);color:var(--amber)}
.ulist{display:flex;flex-wrap:wrap;gap:6px}
.ulist span{border-radius:6px;padding:2px 10px;font-size:15px;border:1px solid var(--line)}
.ulist .y{background:var(--green-lt);border-color:#9fd3b5;color:var(--green);font-weight:600}
.ulist .n{background:#fff;color:var(--muted)}
.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:16.5px}

/* records */
.rec{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.rec .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.rec .u{font-weight:700;font-size:18px}
.rec .meta{font-size:15px;color:var(--muted);margin:4px 0 8px;line-height:1.6}
.rec.pending{border-color:#e2b93b;background:#fffcf3}
.rec .btns{display:flex;flex-wrap:wrap;gap:8px}

/* dictionary */
.dict{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.dict h4{margin:4px 0;font-size:18px;line-height:1.5}
.dict .defbox{margin:6px 0 0}
.uchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.uchips span{font-size:13.5px;background:var(--grey-lt);border-radius:4px;padding:0 7px}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,20,50,.55);display:flex;align-items:flex-end;justify-content:center}
.modal-in{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 14px 24px}
@media(min-width:760px){.modal{align-items:center}.modal-in{border-radius:14px}}
.modal-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.x{border:0;background:var(--grey-lt);border-radius:50%;width:44px;height:44px;font-size:24px;cursor:pointer;flex:none}
table.mini{width:100%;border-collapse:collapse;font-size:15.5px;margin-top:8px}
.mini th,.mini td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.mini td.r,.mini th.r{text-align:right}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;max-width:92vw;z-index:70;font-weight:600;font-size:16.5px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.sync{font-size:15px;margin:12px 2px 0;color:var(--muted)}
.sync.warn{color:var(--amber);font-weight:600}
.sync.ok{color:var(--green)}
footer{font-size:14px;color:var(--muted);text-align:center;margin-top:18px}

/* print */
#printArea{display:none}
@media print{
  body{background:#fff;font-size:10.5pt;padding:0}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  .p-head{display:flex;justify-content:space-between;align-items:flex-start;text-align:center;font-family:var(--title);font-size:10pt;line-height:2}
  .p-head img{width:20mm;height:20mm;display:block;margin:0 auto 2px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .p-title{text-align:center;margin:8px 0 6px}
  .p-title .k{font-family:var(--title);font-size:12.5pt;line-height:2}
  .p-title .e{font-weight:700;font-size:11pt}
  .p-meta{font-size:10pt;margin:4px 0 8px;line-height:1.7}
  .p-h{font-weight:700;font-size:11pt;margin:10px 0 4px}
  table.p{width:100%;border-collapse:separate;border-spacing:0;border-left:.75pt solid #000;font-size:9pt;margin-bottom:8px;table-layout:fixed}
  table.p th,table.p td{border:0;border-top:.4pt solid #000;border-bottom:.4pt solid #000;border-right:.75pt solid #000;padding:3px 5px;vertical-align:top;line-height:1.5;word-wrap:break-word;overflow-wrap:break-word;background:#fff}
  table.p th{text-align:center;font-weight:700;vertical-align:middle;background:#eef2f8;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.p td.c{text-align:center}
  table.p td.grp{background:#dfe6f3;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.p thead{display:table-header-group}
  table.p tr{page-break-inside:avoid;break-inside:avoid}
  .en-s{display:block;font-size:8pt;color:#333}
  .st-met{color:#1a7f4b;font-weight:700}.st-notmet{color:#c8102e;font-weight:700}
  .p-sign{display:flex;justify-content:space-between;margin-top:20px;text-align:center;font-size:10pt;page-break-inside:avoid;gap:10px}
  .p-sign div{flex:1}
  .p-sign .sp{height:58px}
  .p-note{font-size:8.5pt;color:#333;margin-top:6px}
}
</style>
</head>
<body>

<header class="mast">
  <div class="mast-in">
    <div class="emblem"><img id="logoImg" alt="KCPH logo"></div>
    <div class="mast-txt">
      <h1 data-i="appTitle"></h1>
      <p class="sub" data-i="appSub"></p>
    </div>
    <button class="lang" id="langBtn" type="button">EN</button>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab" role="tab" data-tab="Form" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4h6v3H9zM7 5H5v16h14V5h-2"/><path d="M8 12h8M8 16h5"/></svg><span data-i="tabForm"></span></button>
  <button class="tab" role="tab" data-tab="Dash" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-i="tabDash"></span></button>
  <button class="tab" role="tab" data-tab="List" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span data-i="tabList"></span></button>
  <button class="tab" role="tab" data-tab="Dict" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M8 9h8M8 13h6"/></svg><span data-i="tabDict"></span></button>
</nav>

<main class="wrap">

  <!-- ============ FORM ============ -->
  <section class="panel" id="panelForm">
    <div class="editbar" id="editBar" hidden>
      <span data-i="editing"></span>
      <button class="btn sm" type="button" id="cancelEdit" data-i="cancelEdit"></button>
    </div>

    <div class="card">
      <h2 data-i="formTitle"></h2>
      <p class="hint" data-i="formHint"></p>
      <div class="grid g2">
        <div class="f">
          <span class="lab"><span data-i="lPeriod"></span> <span class="req">*</span></span>
          <div class="row2">
            <select id="fMonth" aria-label="Month"></select>
            <select id="fYear" aria-label="Year"></select>
          </div>
        </div>
        <div class="f">
          <label for="fUnit"><span data-i="lUnit"></span> <span class="req">*</span></label>
          <select id="fUnit"></select>
        </div>
        <div class="f">
          <label for="fReporter"><span data-i="lReporter"></span> <span class="req">*</span></label>
          <input type="text" id="fReporter" autocomplete="name">
        </div>
        <div class="f">
          <label for="fPosition" data-i="lPosition"></label>
          <select id="fPosition"></select>
        </div>
        <div class="f">
          <label for="fPhone" data-i="lPhone"></label>
          <input type="tel" id="fPhone" inputmode="tel" autocomplete="tel">
        </div>
      </div>
      <div class="warnline" id="dupWarn" hidden></div>
    </div>

    <div id="baseBox"></div>
    <div id="indBox"></div>

    <div class="card" id="commentCard" hidden>
      <div class="f">
        <label for="fComment" data-i="lComment"></label>
        <textarea id="fComment"></textarea>
      </div>
      <div class="actions">
        <button class="btn" type="button" id="clearBtn" data-i="clear"></button>
      </div>
    </div>
  </section>

  <!-- ============ DASHBOARD ============ -->
  <section class="panel" id="panelDash" hidden>
    <div class="card">
      <h2 data-i="dashTitle"></h2>
      <p class="hint" data-i="dashHint"></p>
      <div class="filters">
        <div><label for="dPeriod" data-i="lPeriod"></label><select class="ctl" id="dPeriod"></select></div>
        <div><label for="dUnit" data-i="lUnit"></label><select class="ctl" id="dUnit"></select></div>
        <label class="chk"><input type="checkbox" id="dVer"><span data-i="verOnly"></span></label>
      </div>
    </div>
    <div class="tiles" id="dTiles"></div>
    <div id="dBand"></div>
    <div class="card">
      <h3 data-i="covTitle"></h3>
      <p class="hint" style="margin:0" data-i="covHint"></p>
      <div class="mgrid" id="dMeasures"></div>
    </div>
    <div class="chartbox"><h3 data-i="trendTitle"></h3><div class="cv"><canvas id="chTrend"></canvas></div></div>
    <div class="card">
      <h3 data-i="indTitle"></h3>
      <p class="hint" data-i="indHint"></p>
      <ul class="ilist" id="dInds"></ul>
    </div>
    <div class="card">
      <h3 data-i="actTitleDash"></h3>
      <div id="dActions"></div>
    </div>
    <div class="card" id="dUnitsCard">
      <h3 data-i="unitsTitle"></h3>
      <div class="ulist" id="dUnits"></div>
    </div>
  </section>

  <!-- ============ RECORDS ============ -->
  <section class="panel" id="panelList" hidden>
    <div class="card">
      <h2 data-i="listTitle"></h2>
      <p class="hint" data-i="listHint"></p>
      <div class="filters">
        <div><label for="rPeriod" data-i="lPeriod"></label><select class="ctl" id="rPeriod"></select></div>
        <div><label for="rUnit" data-i="lUnit"></label><select class="ctl" id="rUnit"></select></div>
        <div><label for="rStatus" data-i="lStatus"></label><select class="ctl" id="rStatus"></select></div>
      </div>
      <div class="actions">
        <button class="btn pri" type="button" id="pdfBtn" data-i="pdf"></button>
        <button class="btn pri" type="button" id="xlsBtn" data-i="xls"></button>
        <button class="btn" type="button" id="refreshBtn" data-i="refresh"></button>
      </div>
    </div>
    <div id="rList"></div>
  </section>

const num = v => { if (v === '' || v == null) return null; const x = Number(v); return isFinite(x) ? x : null; };
function baseVal(k, base, period){
  base = base || {};
  if (k === 'bedDays'){ const b = num(base.beds); return b == null ? null : b * daysIn(period); }
  return num(base[k]);
}
function ndOf(ind, it, base, period){
  it = it || {};
  const n = ind.n[2] ? baseVal(ind.n[2], base, period) : num(it.n);
  const d = ind.u === 'count' ? null : (ind.d[2] ? baseVal(ind.d[2], base, period) : num(it.d));
  return {n, d};
}
function calc(ind, n, d){
  if (n == null) return null;
  if (ind.u === 'count') return n;
  if (d == null || d <= 0) return null;
  if (ind.u === 'pct') return n / d * 100;
  if (ind.u === 'r1000') return n / d * 1000;
  return n / d;
}
function statOf(ind, v){
  if (v == null) return 'nodata';
  switch (ind.dir){
    case 'up': return v >= ind.tgt ? 'met' : 'notmet';
    case 'down': return v <= ind.tgt ? 'met' : 'notmet';
    case 'range': return (v >= ind.lo && v <= ind.hi) ? 'met' : 'notmet';
    case 'zero': return v <= 0 ? 'met' : 'notmet';
    default: return 'mon';
  }
}
function itemState(ind, it, base, period){
  if (it && it.na) return {s:'na', v:null};
  const {n, d} = ndOf(ind, it, base, period);
  const v = calc(ind, n, d);
  const bad = (ind.u === 'pct' && ind.dir !== 'range' && n != null && d != null && n > d);
  return {n, d, v, bad, s: bad ? 'bad' : statOf(ind, v)};
}
const isEntered = st => st.s === 'na' || (st.v != null && !st.bad);

  if (v == null) return '—';
  if (ind.u === 'count') return String(Math.round(v));
  const dp = ind.u === 'r1000' ? 2 : 1;
  return (Math.round(v * Math.pow(10,dp)) / Math.pow(10,dp)).toFixed(dp) + unitSfx(ind);
}

}

/* =====================================================================
   Backend (JSONP over GET — Apps Script has no CORS).
   Reports are larger than a URL, so saves go in base64 chunks + commit.
   ===================================================================== */
function jsonp(params){
  return new Promise((resolve, reject) => {
    const cb = '__qis' + Date.now() + Math.floor(Math.random()*1e6);
    const s = document.createElement('script');
    const q = Object.keys(params).map(k => k + '=' + encodeURIComponent(params[k])).join('&');
    const timer = setTimeout(() => { done(); reject(new Error('timeout')); }, 30000);
    function done(){ clearTimeout(timer); window[cb] = () => {}; s.remove(); }
    window[cb] = d => { done(); resolve(d); };
    s.onerror = () => { done(); reject(new Error('network')); };
    s.src = CONFIG.GAS_URL + '?' + q + '&callback=' + cb;
    document.head.appendChild(s);
  });
}
function toB64(str){
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_');
}
const CHUNK = 3500;
async function sendSave(it){
  const b64 = toB64(JSON.stringify(it.rec));
  const parts = []; for (let i = 0; i < b64.length; i += CHUNK) parts.push(b64.slice(i, i + CHUNK));
  const up = 'U' + uid();
  for (let i = 0; i < parts.length; i += 4){
    const batch = parts.slice(i, i + 4).map((p, k) => jsonp({action:'chunk', uid:up, i:i+k, part:p}));
    const res = await Promise.all(batch);
    if (res.some(r => !r || !r.ok)) throw new Error('chunk');
  }
  const p = {action:'commit', uid:up, n:parts.length};
  if (it.edit) p.edit = 1;
  if (it.pin) p.pin = it.pin;
  return jsonp(p);
}
function applyOutbox(list){
  const m = new Map(list.map(r => [r.id, r]));
  outbox.forEach(o => {
    if (o.op === 'save'){ const r = Object.assign({}, o.rec); delete r.rows; r._pending = true; m.set(r.id, r); }
    else if (o.op === 'verify'){ const r = m.get(o.id); if (r) m.set(o.id, Object.assign({}, r, {status:'verified', verifiedBy:o.by, _pending:true})); }
    else m.delete(o.id);
  });
  return Array.from(m.values());
}
async function load(){
  if (!CONFIG.GAS_URL){ renderAll(); return; }
  try{
    const r = await jsonp({action:'list'});
    if (!r || !r.ok) throw new Error('bad');
    records = applyOutbox(r.records || []);
    store.set('records', records); loadFailed = false;
  }catch(e){ loadFailed = true; }
  renderAll();
}
async function flush(){
  if (!CONFIG.GAS_URL || flushing || !outbox.length) return;
  flushing = true;
  try{
    while (outbox.length){
      const it = outbox[0];
      let r;
      if (it.op === 'save') r = await sendSave(it);
      else if (it.op === 'verify') r = await jsonp({action:'verify', id:it.id, by:it.by, pin:it.pin});
      else r = await jsonp({action:'delete', id:it.id, pin:it.pin});
      if (r && r.ok){ outbox.shift(); store.set('outbox', outbox); }
      else if (r && (r.error === 'PIN' || r.error === 'DUP')){
        outbox.shift(); store.set('outbox', outbox);
        if (r.error === 'PIN') pin = '';
        toast(r.error === 'PIN' ? t('pinWrong') : t('dupServer'));
        flushing = false; await load(); flushing = true;
      } else throw new Error((r && r.error) || 'error');
    }
  }catch(e){ /* stays in the outbox; retried later */ }
  flushing = false;
  if (!outbox.length) await load(); else renderAll();
}

  if (ks.has('beds')) ks.add('pd');

}

function updateProgress(){
  let tot = 0, done = 0;
  if (cur.unit){
    const inds = applicable(cur.unit); tot = inds.length;
    const perM = {};
    inds.forEach(i => {
      const e = isEntered(itemState(i, cur.items[i.id], cur.base, cur.period));
      if (e) done++;
      perM[i.m] = perM[i.m] || [0,0]; perM[i.m][1]++; if (e) perM[i.m][0]++;
    });
    Object.keys(perM).forEach(m => { const b = $('bd-' + m); if (!b) return; const [a, c] = perM[m]; b.textContent = a + '/' + c; b.className = 'badge' + (a === c ? ' done' : a ? ' part' : ''); });
  }
  $('progTxt').textContent = t('prog') + ': ' + done + '/' + tot + ' ' + t('progUnit');
  $('progBar').style.width = tot ? (done / tot * 100) + '%' : '0';
}

function buildRecord(){
  const inds = applicable(cur.unit);
  const items = {}; const rows = [];
  let entered = 0, na = 0, below = 0, acts = 0;
  const now = new Date().toISOString();
  const id = editingId || uid();
  const base = {};
  baseKeysFor(inds).forEach(k => { const v = num(cur.base[k]); if (v != null) base[k] = v; });
  if (base.beds != null) base.bedDays = base.beds * daysIn(cur.period);
  inds.forEach(i => {
    const it = cur.items[i.id] || {};
    const clean = {};
    ['n','d'].forEach(k => { const v = num(it[k]); if (v != null && !(i[k] && i[k][2])) clean[k] = v; });
    if (it.na) clean.na = true;
    ['cause','action','owner','due','note'].forEach(k => { if (it[k] && String(it[k]).trim()) clean[k] = String(it[k]).trim(); });
    const st = itemState(i, clean, base, cur.period);
    if (st.s === 'notmet'){ below++; if (clean.action) acts++; }
    else { delete clean.cause; delete clean.action; delete clean.owner; delete clean.due; }
    if (isEntered(st)) entered++; if (st.s === 'na') na++;
    if (Object.keys(clean).length) items[i.id] = clean;
    rows.push({
      reportId:id, period:cur.period, unitId:cur.unit, unit:unitName(cur.unit,'en'), measure:'QIS.1.1 ' + mcode(i.m), measureName:mOf(i.m).en,
      indicatorId:i.id, indicator:i.en, numerator: st.n == null ? '' : st.n, denominator: st.d == null ? '' : st.d,
      value: st.v == null ? '' : Math.round(st.v * 100) / 100, unitType:i.u, target:tgtText(i,'en'), result: st.s === 'na' ? 'N/A' : stTxtL(st.s,'en'),
      cause:clean.cause || '', action:clean.action || '', owner:clean.owner || '', due:clean.due || '', note:clean.note || ''
    });
  });
  const old = editingId ? records.find(r => r.id === editingId) : null;
  return {
    id, period:cur.period, unit:cur.unit, unitEn:unitName(cur.unit,'en'), unitKm:unitName(cur.unit,'km'),
    reporter:cur.reporter.trim(), position:cur.position, phone:cur.phone.trim(), comment:(cur.comment || '').trim(),
    base, items, status:'submitted', verifiedBy:'', verifiedAt:'',
    createdAt: old ? old.createdAt : now, updatedAt: now,
    summary:{applicable:inds.length, entered, na, below, actions:acts}, rows
  };
}
function save(){
  onHeader(); cur.comment = $('fComment').value;
  if (!cur.period || !cur.unit || !cur.reporter.trim()){ toast(t('needHead')); window.scrollTo({top:0, behavior:'smooth'}); return; }
  if (checkDup()){ toast(t('dupLocal')); window.scrollTo({top:0, behavior:'smooth'}); return; }
  const inds = applicable(cur.unit);
  const sts = inds.map(i => ({i, st:itemState(i, cur.items[i.id], cur.base, cur.period), it:cur.items[i.id] || {}}));
  const bad = sts.filter(x => x.st.s === 'bad');
  if (bad.length){ toast(t('fixBad')); openAndScroll(bad[0].i); return; }
  const missing = sts.filter(x => !isEntered(x.st)).length;
  if (missing && !confirm(fmtT('confirmMissing', {n:missing}))){ const m = sts.find(x => !isEntered(x.st)); if (m) openAndScroll(m.i); return; }
  const noAct = sts.filter(x => x.st.s === 'notmet' && !(x.it.action || '').trim());
  if (noAct.length && !confirm(fmtT('confirmNoAct', {n:noAct.length}))){ openAndScroll(noAct[0].i); return; }
  let p = '';
  if (editingId){ p = askPin(); if (!p) return; }
  const rec = buildRecord();
  const local = Object.assign({}, rec); delete local.rows; if (CONFIG.GAS_URL) local._pending = true;
  const wasEdit = !!editingId;
  if (wasEdit) records = records.map(r => r.id === rec.id ? local : r); else records.push(local);
  store.set('records', records);
  store.set('profile', {reporter:cur.reporter, position:cur.position, phone:cur.phone, unit:cur.unit});
  if (CONFIG.GAS_URL){ outbox.push({op:'save', rec, edit:wasEdit, pin:p}); store.set('outbox', outbox); }
  toast(wasEdit ? t('updated') : t('saved'));
  store.del('draft');
  resetForm(true);
  renderAll();
  flush();
}

function startEdit(id){
  const r = records.find(x => x.id === id); if (!r) return;

/* =====================================================================
   Aggregation
   ===================================================================== */
function recsFor(period, unit, verOnly){
  return records.filter(r => r.period === period && (unit === 'all' || r.unit === unit) && (!verOnly || r.status === 'verified'));
}
function agg(ind, recs){
  let n = 0, d = 0, cnt = 0; const parts = [];
  recs.forEach(r => {
    if (!ind.units.includes(r.unit)) return;
    const it = (r.items || {})[ind.id];
    const st = itemState(ind, it, r.base, r.period);
    if (st.s === 'na'){ parts.push({r, st}); return; }
    if (st.v == null || st.bad) return;
    n += st.n; if (ind.u !== 'count') d += st.d; cnt++;
    parts.push({r, st});
  });
  const v = cnt ? calc(ind, n, ind.u === 'count' ? null : d) : null;
  return {n, d, v, cnt, s:statOf(ind, v), parts};
}
function periodsKnown(){
  const s = new Set(records.map(r => r.period)); s.add(prevPeriod());
  return Array.from(s).filter(Boolean).sort().reverse();
}
function summaryFor(period, unit, verOnly){
  const recs = recsFor(period, unit, verOnly);
  const inds = unit === 'all' ? IND : applicable(unit);
  const rows = inds.map(i => ({i, a:agg(i, recs)}));
  const withData = rows.filter(x => x.a.cnt);
  const withT = withData.filter(x => x.a.s === 'met' || x.a.s === 'notmet');
  const met = withT.filter(x => x.a.s === 'met').length;
  let belowItems = 0, belowActs = 0;
  recs.forEach(r => applicable(r.unit).forEach(i => {
    const it = (r.items || {})[i.id]; const st = itemState(i, it, r.base, r.period);
    if (st.s === 'notmet'){ belowItems++; if (it && it.action) belowActs++; }
  }));
  const measures = MEASURES.map(m => {
    const rs = rows.filter(x => x.i.m === m.id);
    const dat = rs.filter(x => x.a.cnt);
    let s = 'nodata';
    if (dat.length) s = dat.some(x => x.a.s === 'notmet') ? 'notmet' : dat.some(x => x.a.s === 'met') ? 'met' : 'mon';
    return {m, s, has:dat.length, tot:rs.length};
  });
  return {recs, inds, rows, withData:withData.length, withT:withT.length, met, below:withT.length - met, belowItems, belowActs,
          measures, covered:measures.filter(x => x.has).length, unitsRep:new Set(recs.map(r => r.unit)).size};
}

function drawTrend(P, U, vo){
  if (typeof Chart === 'undefined'){ $('chTrend').parentNode.innerHTML = `<p class="empty">${esc(t('noChart'))}</p>`; return; }
  const ps = []; for (let k = 11; k >= 0; k--) ps.push(shiftPeriod(P, -k));
  const pct = [], ur = [];
  ps.forEach(p => { const S = summaryFor(p, U, vo); pct.push(S.withT ? Math.round(S.met / S.withT * 1000) / 10 : null); ur.push(S.unitsRep); });
  if (charts.trend) charts.trend.destroy();
  charts.trend = new Chart($('chTrend'), {
    data:{labels:ps.map(pShort), datasets:[
      {type:'line', label:t('pctMet'), data:pct, borderColor:'#1a7f4b', backgroundColor:'#1a7f4b', yAxisID:'y', tension:.25, spanGaps:true, pointRadius:4, borderWidth:3},
      {type:'bar', label:t('unitsRep'), data:ur, backgroundColor:'rgba(3,46,161,.18)', borderColor:'#032EA1', borderWidth:1, yAxisID:'y1'}
    ]},
    options:{responsive:true, maintainAspectRatio:false, interaction:{mode:'index', intersect:false},
      plugins:{legend:{labels:{font:{family:'Kantumruy Pro', size:13}}}},
      scales:{y:{min:0, max:100, ticks:{callback:v => v + '%'}}, y1:{position:'right', min:0, suggestedMax:UNITS.length, grid:{drawOnChartArea:false}}, x:{ticks:{font:{family:'Kantumruy Pro', size:12}}}}}
  });
}
function openIndModal(id){

const unitIdx = id => { const i = UNITS.findIndex(u => u.id === id); return i < 0 ? 99 : i; };
function viewRecord(id){
  const r = records.find(x => x.id === id); if (!r) return;
  $('mTitle').textContent = unitName(r.unit) + ' · ' + pLabel(r.period);
  const rows = applicable(r.unit).map(i => { const it = (r.items || {})[i.id]; const st = itemState(i, it, r.base, r.period);

function verifyRec(id){
  const r = records.find(x => x.id === id); if (!r) return;
  const p = askPin(); if (!p) return;
  const by = prompt(t('verifierAsk'), (store.get('verifier') || '')); if (!by) return;
  store.set('verifier', by.trim());
  r.status = 'verified'; r.verifiedBy = by.trim(); r.verifiedAt = new Date().toISOString();
  store.set('records', records);
  if (CONFIG.GAS_URL){ outbox.push({op:'verify', id, by:by.trim(), pin:p}); store.set('outbox', outbox); }
  toast(t('verified')); renderAll(); flush();
}
function delRec(id){
  const r = records.find(x => x.id === id); if (!r) return;
  if (!confirm(t('confirmDel') + ' ' + unitName(r.unit) + ' – ' + pLabel(r.period) + '?')) return;
  const p = askPin(); if (!p) return;
  records = records.filter(x => x.id !== id); store.set('records', records);
  outbox = outbox.filter(o => !(o.op === 'save' && o.rec.id === id));
  if (CONFIG.GAS_URL){ outbox.push({op:'delete', id, pin:p}); }
  store.set('outbox', outbox);
  if (editingId === id) resetForm(true);
  toast(t('deleted')); renderAll(); flush();
}

  }));
  const subs = recs.map(r => ({Month:r.period, Unit:unitName(r.unit,'en'), Reporter:r.reporter, Position:(POSITIONS.find(p => p[0] === r.position) || [,,''])[2], Phone:r.phone,
    Applicable:(r.summary || {}).applicable, Completed:(r.summary || {}).entered, 'Below target':(r.summary || {}).below, Status:r.status, 'Verified by':r.verifiedBy || '',
    Updated:dmyTime(r.updatedAt), Comment:r.comment || ''}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheet(matrix, [8,12,50,40,10].concat(Array(12).fill(8))), 'Monthly ' + year);
  XLSX.utils.book_append_sheet(wb, sheet(long, [9,24,24,8,12,50,11,12,10,10,12,30,12,20]), 'Unit data');
  XLSX.utils.book_append_sheet(wb, sheet(acts, [9,24,8,50,9,10,40,40,20,12]), 'Actions (PDSA)');
  XLSX.utils.book_append_sheet(wb, sheet(subs, [9,24,20,24,14,10,10,10,11,18,16,40]), 'Submissions');
  XLSX.utils.book_append_sheet(wb, sheet(dictRows(), [8,12,30,45,45,60,60,45,10,12,30,40]), 'Definitions');
  XLSX.writeFile(wb, `KCPH_QIS1.1_Indicators_${P === 'all' ? year : P}${U === 'all' ? '' : '_' + U}.xlsx`);
}
function exportDict(){
  if (typeof XLSX === 'undefined'){ toast(t('noXlsx')); return; }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheet(dictRows(), [8,12,30,45,45,60,60,45,10,12,30,40]), 'QIS.1.1 Definitions');
  XLSX.writeFile(wb, 'KCPH_QIS1.1_Indicator_Definitions.xlsx');
}

/* =====================================================================
   Shell: tabs, language, wiring
   ===================================================================== */
let tab = 'Form';
function showTab(name){
  tab = name;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === name ? 'true' : 'false'));
  ['Form','Dash','List','Dict'].forEach(n => $('panel' + n).hidden = n !== name);
  $('saveBar').hidden = name !== 'Form';
  document.body.style.paddingBottom = name === 'Form' ? '' : '20px';
  renderTab();
}
function renderTab(){
  if (tab === 'Dash') renderDash();
  if (tab === 'List') renderList();
  if (tab === 'Dict') renderDict();
}
function renderAll(){ syncLine(); checkDup(); renderTab(); }
function applyLang(){
  document.documentElement.lang = lang;
  $('langBtn').textContent = lang === 'km' ? 'EN' : 'ខ្មែរ';
  document.querySelectorAll('[data-i]').forEach(el => el.textContent = t(el.dataset.i));
  $('saveBtn').textContent = editingId ? t('saveEdit') : t('save');
  $('foot').textContent = (lang === 'km' ? CONFIG.HOSPITAL_KM : CONFIG.HOSPITAL_EN) + ' | CHAS QIS.1.1 – QIS.1.2';
  fillHeaderSelects(); renderInds(); renderAll();
}
function init(){
  cur = blankCur();
  $('logoImg').src = LOGO;
  const prof = store.get('profile') || {};
  const draft = store.get('draft');
  if (draft && draft.unit){ cur = Object.assign(blankCur(), draft); setTimeout(() => toast(t('draftRestored')), 400); }
  else { cur.reporter = prof.reporter || ''; cur.position = prof.position || ''; cur.phone = prof.phone || ''; cur.unit = prof.unit || ''; }
  ['fMonth','fYear','fUnit','fPosition'].forEach(id => $(id).addEventListener('change', onHeader));
  ['fReporter','fPhone'].forEach(id => $(id).addEventListener('input', onHeader));
  $('fComment').addEventListener('input', () => { cur.comment = $('fComment').value; draftSoon(); });
  $('indBox').addEventListener('input', onItem); $('indBox').addEventListener('change', onItem);
  $('baseBox').addEventListener('input', onBase);
  $('saveBtn').addEventListener('click', save);
  $('clearBtn').addEventListener('click', () => { if (confirm(t('confirmClear'))){ store.del('draft'); resetForm(true); } });
  $('cancelEdit').addEventListener('click', () => resetForm(true));
  $('langBtn').addEventListener('click', () => { lang = lang === 'km' ? 'en' : 'km'; store.set('lang', lang); applyLang(); });
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
  ['dPeriod','dUnit','dVer'].forEach(id => $(id).addEventListener('change', renderDash));
  ['rPeriod','rUnit','rStatus'].forEach(id => $(id).addEventListener('change', renderList));
  $('xSearch').addEventListener('input', renderDict); $('xMeasure').addEventListener('change', renderDict);
  $('dInds').addEventListener('click', e => { const li = e.target.closest('[data-ind]'); if (li) openIndModal(li.dataset.ind); });
  $('dMeasures').addEventListener('click', e => { const b = e.target.closest('[data-goto]'); if (b){ const el = $('dm-' + b.dataset.goto); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); } });
  $('rList').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.view) viewRecord(b.dataset.view);
    if (b.dataset.edit) startEdit(b.dataset.edit);
    if (b.dataset.ver) verifyRec(b.dataset.ver);
    if (b.dataset.del) delRec(b.dataset.del);
  });
  $('pdfBtn').addEventListener('click', printReport);
  $('xlsBtn').addEventListener('click', exportXlsx);
  $('refreshBtn').addEventListener('click', () => { flush(); load(); });
  $('dictPdf').addEventListener('click', printDict);
  $('dictXls').addEventListener('click', exportDict);
  $('mClose').addEventListener('click', () => $('modal').hidden = true);
  $('modal').addEventListener('click', e => { if (e.target.id === 'modal') $('modal').hidden = true; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $('modal').hidden = true; });
  window.addEventListener('online', flush);
  lang = store.get('lang') || 'km';
  applyLang(); showTab('Form');
  load().then(flush);
  setInterval(flush, 60000);
}
init();

</script>
